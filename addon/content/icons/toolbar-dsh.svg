<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="24" height="24" viewBox="0 0 96 96">
  <!-- 工具栏用：剪影只作亮度蒙版，颜色取工具条前景色（context-fill） -->
  <defs>
    <mask id="whale" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96">
      <image x="0" y="0" width="96" height="96" xlink:href="data:image/png;base64," href="data:image/png;base64,"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="96" height="96" fill="context-fill" mask="url(#whale)"/>
</svg>
