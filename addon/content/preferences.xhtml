<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<!--
  ⚠️ `onload` 与 `onshowing` **都要**挂，这不是冗余。

  真机反馈："下拉框先是正常，退出重进设置页后变空。"

  原因：Zotero 把面板内容**缓存**在 DOM 里 —— 切到别的设置页只是把它隐藏，
  再切回来时 `onload` **不会再触发**（它只在片段插入时触发一次）。
  于是重进之后没人重新填充下拉框，而 menulist 在偏好同步时找不到对应
  item，`value` 就变成空串 —— 看起来就是"变空了"。

  Zotero 在显示面板时会给容器的每个子元素派发 `showing` 事件
  （见 Zotero 的 `preferences.js` `_showPane`：`child.dispatchEvent(new Event('showing'))`）。
  所以用 `onshowing` 重跑一次初始化，重进也能恢复正常。
-->
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
  onshowing="Zotero.__addonInstance__.hooks.onPrefsEvent('showing', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <!--
    ── 隔离运行时（唯一方式）────────────────────────────
    ⚠️ 这里原有「使用隔离运行时」开关（`useIsolatedRuntime`）。
    用户要求**删除共享模式、只允许隔离使用** —— 既然没有另一种模式可切，
    开关就失去意义（关掉它不会切到别的模式，只会让插件连不上），故移除。
    代码侧的对应分支也已删除（见 config.ts）。
  -->
  <label><html:h3 data-l10n-id="pref-isolated"></html:h3></label>
  <description data-l10n-id="pref-isolated-desc"></description>
  <hbox align="center">
    <html:label
      for="__addonRef__-isolated-port"
      data-l10n-id="pref-isolated-port"
    ></html:label>
    <html:input
      type="number"
      id="__addonRef__-isolated-port"
      preference="__prefsPrefix__.isolatedPort"
      min="1024"
      max="65535"
      style="width: 90px"
    ></html:input>
    <label data-l10n-id="pref-isolated-port-hint"></label>
  </hbox>
  <hbox align="center">
    <html:label
      for="__addonRef__-harness-dir"
      data-l10n-id="pref-harness-dir"
    ></html:label>
    <html:input
      type="text"
      id="__addonRef__-harness-dir"
      preference="__prefsPrefix__.harnessDir"
      style="width: 320px"
    ></html:input>
  </hbox>
  <hbox align="center">
    <label
      id="__addonRef__-runtime-status"
      data-l10n-id="pref-runtime-status"
    ></label>
    <description
      id="__addonRef__-runtime-status"
      data-l10n-id="pref-runtime-unknown"
    ></description>
  </hbox>
  <hbox align="center">
    <button
      id="__addonRef__-runtime-prepare"
      label="准备运行时"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('runtime-prepare', {
          window,
        })
      "
    ></button>
    <button
      id="__addonRef__-runtime-start"
      label="启动"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('runtime-start', { window })
      "
    ></button>
    <button
      id="__addonRef__-runtime-stop"
      label="停止"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('runtime-stop', { window })
      "
    ></button>
  </hbox>

  <!-- ── 自检（用户要求：从工具菜单搬到这里）────────────── -->
  <label><html:h3 data-l10n-id="pref-selfcheck"></html:h3></label>
  <description data-l10n-id="pref-selfcheck-desc"></description>
  <hbox align="center">
    <button
      id="__addonRef__-selfcheck"
      label="运行自检"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('selfcheck', { window })
      "
    ></button>
    <button
      id="__addonRef__-selfcheck-stream"
      label="含流式实测"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('selfcheck-stream', {
          window,
        })
      "
    ></button>
    <button
      id="__addonRef__-deep-probe"
      label="深度探测"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('deep-probe', { window })
      "
    ></button>
    <!--
      新手引导：首次启动会自动弹一次；这里给一个随时重开的入口。
      没有它，用户看漏了引导就再也找不回来（内容见 addon/content/onboarding.xhtml）。
    -->
    <button
      id="__addonRef__-onboarding"
      label="新手引导"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('onboarding', { window })
      "
    ></button>
  </hbox>
  <description
    id="__addonRef__-selfcheck-summary"
    data-l10n-id="pref-selfcheck-idle"
  ></description>
  <html:textarea
    id="__addonRef__-selfcheck-report"
    readonly="readonly"
    rows="14"
    style="
      width: 100%;
      box-sizing: border-box;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
    "
  ></html:textarea>

  <!--
    ⚠️ 这里原有「会话挂载」选择（网页链接 / 文件链接 / 文件 / 子笔记）。
    用户要求**只保留目前方案** —— 即网页链接（`web-link`，
    指向插件自己的会话页，双击即在 Zotero 内打开可交互界面）。
    其余三种形态（文件链接 / 文件 / 子笔记）都无法自己调用 dsh，只能看不能问，
    留着只会让人选到"看起来一样、实际不能对话"的形态，故移除选择项。
    代码侧现在只有一条挂载路径（见 `sessionPane.ts` 的 `mountSession`），
    `sessionMount` 偏好与 `mountMode()` 都已删除。

    ⚠️ 这里原有「怎么用」一节（三条说明）。用户要求移除。
  -->

  <!--
    ⚠️ 这里原有「共享模式（回退用）」一整节：端口 / 认证方式 / DSH_HOME / 启动 URL。
    用户要求**删除共享模式、只允许隔离使用** —— 代码侧的回退分支也已删除
    （见 config.ts：`resolveRuntimeConfig()` 未就绪时返回 undefined，
    调用方明确报"运行时未就绪"，不再偷偷连到桌面版实例）。
    既然回退不存在了，这几项就没有任何作用，故整节移除。
  -->

  <!--
    ── 阅读器面板 ───────────────────────────────────
    ⚠️ 这一节的几项**只对阅读器侧栏面板生效**（代码依据：它们只被 readerPanel.ts 读取）。
    真机反馈"设置里有很多没意义的内容"：原先它们散在「上下文」与「行为」两节里、
    名字又很泛（"行为"），用户会以为改了能影响全局 —— 会话页其实完全不读它们。
    所以按**实际生效范围**归到一节，标题写明限定。
  -->
  <label><html:h3 data-l10n-id="pref-reader"></html:h3></label>
  <description data-l10n-id="pref-reader-desc"></description>
  <hbox align="center">
    <html:label
      for="__addonRef__-chunk-bytes"
      data-l10n-id="pref-chunk-bytes"
    ></html:label>
    <html:input
      type="number"
      id="__addonRef__-chunk-bytes"
      preference="__prefsPrefix__.chunkBytes"
      min="4096"
      max="40960"
      step="4096"
      style="width: 100px"
    ></html:input>
  </hbox>
  <label data-l10n-id="pref-chunk-bytes-hint"></label>
  <checkbox
    id="__addonRef__-confirm-first"
    preference="__prefsPrefix__.confirmFirstSend"
    data-l10n-id="pref-confirm-first"
  />
  <checkbox
    id="__addonRef__-streaming"
    preference="__prefsPrefix__.streaming"
    data-l10n-id="pref-streaming"
  />
  <!--
    ⚠️ 这条说明是**必要的**，不是装饰。
    真机自检 + 内省已定位：流式需要 WebSocket，而 WebSocket 握手要带登录 cookie，
    沙箱里 cookie 罐写不进去 —— 所以它在当前环境**基本不会成功**。
    没有这条说明，用户会以为勾了就能逐字显示，然后反复排查"为什么没生效"。
  -->
  <description data-l10n-id="pref-streaming-hint"></description>
  <hbox align="center">
    <html:label
      for="__addonRef__-answer-lang"
      data-l10n-id="pref-answer-language"
    ></html:label>
    <menulist
      id="__addonRef__-answer-lang"
      preference="__prefsPrefix__.answerLanguage"
      native="true"
    >
      <menupopup>
        <menuitem label="中文" value="zh-CN"></menuitem>
        <menuitem label="English" value="en-US"></menuitem>
      </menupopup>
    </menulist>
  </hbox>
  <hbox align="center">
    <html:label
      for="__addonRef__-highlight-color"
      data-l10n-id="pref-highlight-color"
    ></html:label>
    <html:input
      type="text"
      id="__addonRef__-highlight-color"
      preference="__prefsPrefix__.highlightColor"
      style="width: 100px"
    ></html:input>
    <label data-l10n-id="pref-highlight-color-hint"></label>
  </hbox>
  <html:textarea
    id="__addonRef__-custom-commands"
    preference="__prefsPrefix__.customCommands"
    rows="5"
    style="width: 420px; font-family: monospace"
  ></html:textarea>
  <label data-l10n-id="pref-custom-commands-hint"></label>

  <!--
    ── 模型 ─────────────────────────────────────────
    ⚠️ 这一节补的是一个**真实的可用性缺口**，不是"多一个设置项"。

    隔离实例的模型凭据一律从本机桌面版 Harness 复制（见 credentialMerge.ts）。
    于是**没装过桌面版、或装了但没登录/没配 key** 的用户完全用不了插件 ——
    而错误藏在 turn/end 的 reason 里，界面只表现为问答失败、看不出原因。

    所以这里让用户能**在 Zotero 里直接填**：填了就用他的，没填就沿用桌面版。

    推理等级的候选值**不写死**：由 `onPrefsEvent` 从 `session/modelCatalog`
    动态填充（模型自己声明有哪些等级）。写死一份的话，模型换了就会给出
    宿主不接受的取值，而失败是静默的（用户只看到"没生效"）。
  -->
  <label><html:h3 data-l10n-id="pref-model"></html:h3></label>
  <description data-l10n-id="pref-model-desc"></description>

  <hbox align="center">
    <html:label
      for="__addonRef__-model-api-key"
      data-l10n-id="pref-model-api-key"
    ></html:label>
    <!-- 刻意用 type="password"：肩窥与截图场景下不该直接暴露密钥 -->
    <html:input
      type="password"
      id="__addonRef__-model-api-key"
      style="width: 320px"
      placeholder="sk-…"
    ></html:input>
    <button
      id="__addonRef__-model-save-key"
      data-l10n-id="pref-model-save-key"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('model-save-key', {
          window,
        })
      "
    />
  </hbox>
  <label data-l10n-id="pref-model-api-key-hint"></label>

  <hbox align="center">
    <html:label
      for="__addonRef__-model-base-url"
      data-l10n-id="pref-model-base-url"
    ></html:label>
    <html:input
      type="text"
      id="__addonRef__-model-base-url"
      style="width: 320px"
      placeholder="https://api.deepseek.com"
    ></html:input>
  </hbox>
  <!--
    ⚠️ 这条说明是**必要的**，不是装饰。
    换 baseURL 只是换"请求发往哪里"，协议仍是 DeepSeek Messages 那一套。
    没有这条说明，用户会拿 OpenAI 的地址来填，然后得到一堆看不懂的报错 ——
    而真正的原因是"那是另一套协议"，不是地址写错了。
  -->
  <label data-l10n-id="pref-model-base-url-hint"></label>

  <hbox align="center">
    <html:label
      for="__addonRef__-model-id"
      data-l10n-id="pref-model-id"
    ></html:label>
    <menulist
      id="__addonRef__-model-id"
      preference="__prefsPrefix__.modelId"
      onsyncfrompreference="Zotero.__addonInstance__.hooks.onPrefsEvent('model-sync', { window, target: this })"
      style="min-width: 320px"
    >
      <menupopup />
    </menulist>
    <button
      id="__addonRef__-model-refresh"
      data-l10n-id="pref-model-refresh"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('model-refresh', { window })
      "
    />
  </hbox>

  <hbox align="center">
    <html:label
      for="__addonRef__-model-effort"
      data-l10n-id="pref-model-effort"
    ></html:label>
    <menulist
      id="__addonRef__-model-effort"
      preference="__prefsPrefix__.modelReasoningEffort"
      onsyncfrompreference="Zotero.__addonInstance__.hooks.onPrefsEvent('model-sync', { window, target: this })"
      style="min-width: 220px"
    >
      <menupopup />
    </menulist>
  </hbox>
  <label
    id="__addonRef__-model-status"
    data-l10n-id="pref-model-status"
  ></label>

  <!--
    ── 自定义 provider（GLM / Moonshot / Qwen / 自建…）──────────
    ⚠️ 与上面的「API 地址」是**两条不同的路**，必须在界面上讲清：
      · 上面那栏换的是 llm-deepseek 适配器的端点（Anthropic Messages 协议）；
      · 这一栏会挂载 llm-pi-ai，支持 OpenAI 兼容 / Anthropic / OpenAI Responses。
    用 JSON 编辑而不是动态表单：provider 是"数量不定、每个含模型清单"的结构，
    做成表单会非常庞大；而目标用户（要接自建端点的人）对 JSON 不陌生。
  -->
  <label><html:h3 data-l10n-id="pref-providers"></html:h3></label>
  <description data-l10n-id="pref-providers-desc"></description>
  <html:textarea
    id="__addonRef__-custom-providers"
    rows="10"
    style="
      width: 100%;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
    "
  ></html:textarea>
  <hbox align="center">
    <button
      id="__addonRef__-providers-save"
      data-l10n-id="pref-providers-save"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('providers-save', {
          window,
        })
      "
    />
    <button
      id="__addonRef__-providers-example"
      data-l10n-id="pref-providers-example"
      oncommand="
        Zotero.__addonInstance__.hooks.onPrefsEvent('providers-example', {
          window,
        })
      "
    />
  </hbox>
  <label
    id="__addonRef__-providers-status"
    data-l10n-id="pref-providers-status"
  ></label>

  <!--
    ── 高级 ─────────────────────────────────────────
    这里放"平时不用动、但出问题时需要调"的项。
    `requestTimeoutMs` 原先**代码在读、设置页却没有** —— 用户既看不到、也改不了，
    等于写死 15 秒（半成品残留）。现在暴露出来。
  -->
  <label><html:h3 data-l10n-id="pref-advanced"></html:h3></label>
  <hbox align="center">
    <html:label
      for="__addonRef__-request-timeout"
      data-l10n-id="pref-request-timeout"
    ></html:label>
    <html:input
      type="number"
      id="__addonRef__-request-timeout"
      preference="__prefsPrefix__.requestTimeoutMs"
      min="5000"
      max="120000"
      step="1000"
      style="width: 110px"
    ></html:input>
    <label data-l10n-id="pref-request-timeout-hint"></label>
  </hbox>
  <checkbox
    id="__addonRef__-install-skill"
    preference="__prefsPrefix__.installSkill"
    data-l10n-id="pref-install-skill"
  />
  <checkbox
    id="__addonRef__-install-agents"
    preference="__prefsPrefix__.installAgentInstructions"
    data-l10n-id="pref-install-agents"
  />
  <label data-l10n-id="pref-install-hint"></label>

  <vbox>
    <label
      data-l10n-id="pref-help"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
    ></label>
  </vbox>
</groupbox>
