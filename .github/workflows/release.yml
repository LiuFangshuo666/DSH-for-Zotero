name: Release

# ⚠️ 这份工作流同样是**给 GitHub 用的**，在 Gitee 上不会运行
# （原因见 ci.yml 顶部说明）。
#
# 它调用 `zotero-plugin-dev` 的发布工作流，把构建好的 xpi 传到 **GitHub Releases**。
# 如果本仓库只在 Gitee 上发布，请改用 Gitee 的「附件 / Release」功能手动上传
# `.scaffold/build/dsh-for-zotero.xpi` —— 那是构建产物，不需要额外打包。
#
# 手动发布的步骤：
#   1. npm run verify          # 确认构建 + 测试 + 产物核验都过
#   2. npm run build           # 生成 .scaffold/build/dsh-for-zotero.xpi
#   3. 在 Gitee 上新建 tag（例如 v0.1.0）与 Release，上传上面那个 xpi

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    uses: zotero-plugin-dev/workflows/.github/workflows/release-plugin.yml@main
    with:
      build: "npm run build"
      release: "npm run release"
    secrets: inherit
