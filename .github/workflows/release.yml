name: Release

# 推一个 `v*` tag 时，在 **GitHub Releases** 上自动建 Release 并附上构建好的 xpi。
#
# ⚠️ 它**只作用于 GitHub**（Gitee 不执行 `.github/workflows/`）。
# 所以发版是两步：
#
#   1. 推 tag 到 GitHub → 这里自动构建并发布 Release（市场收录与手动下载用）
#   2. 在 Gitee 上手动建 Release 并上传同一个 xpi（自动更新清单指向它）
#
# 顺序不能反：`update.json` 的 `update_link` 指向 Gitee 的
# `releases/download/v{版本}/dsh-for-zotero.xpi`；Gitee 上没有那个 Release 时，
# 用户更新会 404。
#
# 本地发版步骤见 README 的「版本号规则」与「发布渠道与双仓库同步」。

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    uses: zotero-plugin-dev/workflows/.github/workflows/release-plugin.yml@main
    with:
      build: "npm run build"
      release: "npm run release"
    secrets: inherit
